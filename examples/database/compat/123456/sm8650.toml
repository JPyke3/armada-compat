schema_version = 1

[target]
soc = "sm8650"

[[compatibility]]
runtime = "proton"
proton-architecture = "x86_64"
proton-version = "9"
proton-variant = "ge"
default = true
status = "playable"
confidence = "community"
notes = "GE-Proton 9 is preferred and demonstrates explicit core ordering and executable shorthand."

[[compatibility]]
runtime = "proton"
proton-architecture = "x86_64"
proton-version = "9"
proton-variant = "steam"
status = "playable"
confidence = "community"
notes = "An explicitly tested Steam Proton fallback when the preferred variant is unavailable."

[[compatibility]]
runtime = "proton"
proton-architecture = "x86_64"
proton-version = "11"
proton-variant = "steam"
status = "boots"
confidence = "experimental"
notes = "Demonstrates a regression on a newer Proton release track."

[settings.launch]
# A scalar is shorthand for a Proton/Windows executable suffix.
exe-append = "/../ExampleGame.exe"

[settings.cpu]
cores = [7, 2, 3, 4, 5, 6]
wine_topology = false
nice = -5
scheduler = "lavd"

[settings.fex]
preset = "fast"

