schema_version = 1

[target]
soc = "sm8550"
devices = ["example-handheld", "example-handheld-pro"]

[[compatibility]]
runtime = "proton"
proton-architecture = "arm64"
proton-version = "experimental"
proton-variant = "steam"
default = true
status = "verified"
confidence = "maintainer"
notes = "Demonstrates a verified ARM64 Proton result, safe default, and named core preset."

[[compatibility]]
runtime = "proton"
proton-architecture = "x86_64"
proton-version = "9"
proton-variant = "ge"
status = "playable"
confidence = "community"
notes = "Demonstrates a separately tested conventional x86_64 Proton build."

[[compatibility]]
runtime = "slr"
status = "playable"
confidence = "community"
notes = "Demonstrates a separate Steam Linux Runtime result."

[[compatibility]]
runtime = "native"
status = "boots"
confidence = "experimental"
notes = "Demonstrates a native build that starts but has significant blockers."

[[compatibility]]
runtime = "wine"
status = "broken"
confidence = "experimental"
notes = "Demonstrates recording a failed Wine test."

[settings.cpu]
preset = "big"
wine_topology = true
nice = 0
scheduler = "eevdf"

[settings.fex.overrides]
Multiblock = "0"
MaxInstPerBlock = "100000"

[settings.environment]
EXAMPLE_OPTION = "sm8550"

[[reports]]
runtime = "proton"
proton-architecture = "arm64"
proton-version = "experimental"
proton-variant = "steam"
tested_at = 2026-09-16
distro = "Example Linux"
